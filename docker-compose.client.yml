services:
  metrics-client:
    build:
      context: .
      dockerfile: Dockerfile.client
      network: host
    image: iobt26-client:latest
    container_name: iobt26-metrics-client
    volumes:
      - ./system:/app/system
      - ./logs:/app/logs
      - ./3rdparty:/app/3rdparty
    environment:
      - PYTHONUNBUFFERED=1
      - ORIGINAL=${ORIGINAL:-127.0.0.1:8190}
      - SERVER1=${SERVER1:-127.0.0.1:8181}
      - SERVER2=${SERVER2:-127.0.0.1:8182}
      - HEAD=${HEAD:-127.0.0.1:8180}
    restart: "no"
    network_mode: "host"
    command: ["python3", "system/metrics_client.py", "-d", "${DURATION:-0.05}", "-f", "-w", "-i", "${EXPERIMENT_ID:-experiment}", "--task", "${TASK:-effnet}"]
